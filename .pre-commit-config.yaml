repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: poetry run ruff check --fix --no-unsafe-fixes
        language: system
        types: [python]

      - id: ruff-format
        name: ruff-format
        entry: poetry run ruff format
        language: system
        types: [python]

      - id: nbstripout
        name: nbstripout
        entry: poetry run nbstripout
        language: system
        files: \.ipynb$

      - id: pytest
        name: pytest
        entry: poetry run pytest -W error -q --basetemp=tmp/pre-commit-pytest
        language: system
        pass_filenames: false
        always_run: true
