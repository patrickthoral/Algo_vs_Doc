<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1578" viewBox="0 0 1000 1578" role="img" aria-labelledby="title description">
  <title id="title">Study enrolment flow</title>
  <desc id="description">Separate hospital panels showing eligible ICU discharges after each sequential exclusion.</desc>
  <defs>
